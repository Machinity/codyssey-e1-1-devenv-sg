# 보너스: Docker Compose 기초 / 멀티 컨테이너 예시
# 실행: docker compose up -d   /   종료: docker compose down
# 상태: docker compose ps      /   로그: docker compose logs -f

services:
  web:
    build:
      context: ../app
    ports:
      - "8080:80"
    environment:
      - APP_ENV=dev
    volumes:
      - ../app/src:/usr/share/nginx/html

